name: workshop-manager

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workshop}
      POSTGRES_USER: ${POSTGRES_USER:-workshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/Facade/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Postgres__ConnectionString: Host=db;Port=5432;Database=${POSTGRES_DB:-workshop};Username=${POSTGRES_USER:-workshop};Password=${POSTGRES_PASSWORD}
      Postgres__CommandTimeoutSeconds: ${POSTGRES_COMMAND_TIMEOUT_SECONDS:-30}
      Jwt__Secret: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-workshop-manager}
      Jwt__Audience: ${JWT_AUDIENCE:-workshop-manager-clients}
      Jwt__ExpiresMinutes: ${JWT_EXPIRES_MINUTES:-60}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:8082}
      RateLimiting__LoginPermitLimit: ${LOGIN_PERMIT_LIMIT:-10}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8082:8080"

volumes:
  pgdata:
