<div class="shell" [class.nav-open]="navOpen()">
  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand" routerLink="/dashboard">
      <span class="mark">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
          <path d="M19.6 8.4a1.6 1.6 0 0 0 0 2.2l1.2 1.2a1.6 1.6 0 0 0 2.2 0l2.8-2.8a6 6 0 0 1-7.6 7.6l-7.4 7.4a2.1 2.1 0 0 1-3-3l7.4-7.4a6 6 0 0 1 7.6-7.6z" fill="currentColor" />
        </svg>
      </span>
      <span class="wordmark">Workshop<span>Manager</span></span>
    </a>

    <nav class="nav">
      @for (item of navItems(); track item.path) {
        <a class="nav-link" [routerLink]="item.path" routerLinkActive="active">
          <app-icon [name]="item.icon" />
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <span class="avatar">{{ initials() }}</span>
        <span class="who">
          <strong>{{ auth.user()?.fullName }}</strong>
          <small>{{ roleLabel() }}</small>
        </span>
      </div>
      <button class="signout" type="button" (click)="logout()">
        <app-icon name="logout" [size]="16" />
        Sign out
      </button>
    </div>
  </aside>

  <button class="scrim" type="button" aria-label="Close navigation" (click)="toggleNav()"></button>

  <div class="main">
    <header class="topbar">
      <button class="btn btn-icon menu-button" type="button" aria-label="Open navigation" (click)="toggleNav()">
        <app-icon name="menu" />
      </button>
      <h1>{{ pageTitle() }}</h1>
      <span class="topbar-spacer"></span>
      <span class="role-tag">{{ roleLabel() }}</span>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>

<app-toast-container />
